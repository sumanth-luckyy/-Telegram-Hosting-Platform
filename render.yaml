
services:
  - type: worker
    name: telegram-hosting-platform
    runtime: python
    region: singapore
    plan: starter

    buildCommand: pip install -r requirements.txt
    startCommand: python main.py

    disk:
      name: hosting-data
      mountPath: /var/data
      sizeGB: 1

    envVars:
      - key: BOT_TOKEN
        sync: false

      - key: ADMIN_IDS
        sync: false

      - key: PERSISTENT_DISK_PATH
        value: /var/data
        
